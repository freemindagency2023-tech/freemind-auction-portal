{% extends 'auctions/base.html' %}

{% block title %}
Badilisha Password - Freemind Auction Agency
{% endblock %}

{% block content %}
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<div class="max-w-md mx-auto px-4 py-12">
    <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-100">
        <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center text-xl mb-4">
            <i class="fa-solid fa-key"></i>
        </div>
        <h2 class="text-2xl font-bold text-slate-800 mb-2">Badilisha Password</h2>
        <p class="text-slate-500 text-sm mb-6">Weka password yako ya sasa na kisha ujaze mpya.</p>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            
            {{ form.as_p }}

            <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-3 px-4 rounded-xl transition-all shadow-sm">
                Hifadhi Password Mpya
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="{% url 'dashboard' %}" class="text-sm font-semibold text-indigo-600 hover:text-indigo-800">
                <i class="fa-solid fa-arrow-left mr-1"></i> Rudi kwenye Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
