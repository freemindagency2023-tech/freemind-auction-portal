{% extends 'auctions/base.html' %}

{% block title %}Categories | Freemind Auction{% endblock %}

{% block content %}

<style>
    .category-page {
        font-family: 'Plus Jakarta Sans', sans-serif;
        color: #0f172a;
    }

    .category-header {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 18px;
        padding: 30px;
        margin-bottom: 30px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
    }

    .category-header h1 {
        margin: 0 0 8px;
        font-size: 2rem;
        font-weight: 800;
    }

    .category-header p {
        margin: 0;
        color: #64748b;
        font-weight: 600;
    }

    /* =====================================================
       CATEGORY GRID
       ===================================================== */

    .categories-grid {
        display: grid;
        grid-template-columns: repeat(
            auto-fill,
            minmax(220px, 1fr)
        );
        gap: 20px;
        margin-bottom: 30px;
    }

    .category-card {
        display: block;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 25px;
        text-decoration: none;
        color: #0f172a;
        transition: all 0.25s ease;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
    }

    .category-card:hover,
    .category-card.active {
        transform: translateY(-4px);
        border-color: #0284c7;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    }

    .category-icon {
        font-size: 2.5rem;
        margin-bottom: 12px;
    }

    .category-name {
        font-size: 1.15rem;
        font-weight: 800;
        margin-bottom: 7px;
    }

    .subcategory-count {
        color: #64748b;
        font-size: 0.85rem;
        font-weight: 600;
    }

    /* =====================================================
       SUBCATEGORY
       ===================================================== */

    .subcategories-box {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 22px;
        margin-bottom: 30px;
    }

    .subcategories-box h2 {
        margin: 0 0 16px;
        font-size: 1.2rem;
        font-weight: 800;
    }

    .subcategory-links {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
    }

    .subcategory-link {
        background: #ffffff;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        padding: 9px 15px;
        text-decoration: none;
        color: #334155;
        font-size: 0.85rem;
        font-weight: 700;
        transition: all 0.2s ease;
    }

    .subcategory-link:hover,
    .subcategory-link.active {
        background: #0284c7;
        border-color: #0284c7;
        color: #ffffff;
    }

    /* =====================================================
       ITEMS
       ===================================================== */

    .items-section-title {
        font-size: 1.5rem;
        font-weight: 800;
        margin: 0 0 20px;
    }

    .items-grid {
        display: grid;
        grid-template-columns: repeat(
            auto-fill,
            minmax(300px, 1fr)
        );
        gap: 22px;
        margin-bottom: 30px;
    }

    .item-card {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
        transition: all 0.25s ease;
    }
